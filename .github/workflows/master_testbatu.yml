name: Deploy Node.js App to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Debug and create missing workspace packages
        run: |
          echo "Repository structure:"
          ls -la
          echo "Checking packages directory:"
          ls -la packages/ || echo "No packages directory"
          
          # Create missing workspace packages if they don't exist
          echo "Creating missing workspace packages..."
          mkdir -p packages/eslint-config
          echo '{"name": "@repo/eslint-config", "version": "0.0.0", "private": true, "main": "index.js"}' > packages/eslint-config/package.json
          echo 'module.exports = {};' > packages/eslint-config/index.js
          
          mkdir -p packages/typescript-config  
          echo '{"name": "@repo/typescript-config", "version": "0.0.0", "private": true, "main": "base.json"}' > packages/typescript-config/package.json
          echo '{}' > packages/typescript-config/base.json
          
          echo "Packages directory after creation:"
          ls -la packages/

      - name: Install dependencies
        run: npm install
          
      - name: Build web app
        run: npm run build:web

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testbatu'
          slot-name: 'production'
          package: './apps/web'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZUREAPPSERVICE_PASSWORD }}
