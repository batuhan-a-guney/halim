name: Deploy Node.js App to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Debug repository structure
        run: |
          echo "Root directory contents:"
          ls -la
          echo "Packages directory contents:"
          ls -la packages/ || echo "No packages directory"
          echo "Apps directory contents:"
          ls -la apps/
          echo "Looking for eslint-config:"
          find . -name "eslint-config" -type d || echo "No eslint-config directory found"
          echo "All package.json files:"
          find . -name "package.json" | head -20

      - name: Install dependencies with force
        run: |
          # Force install without resolving workspace packages
          npm install --force
          
      - name: Build web app
        run: npm run build:web

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testbatu'
          slot-name: 'production'
          package: './apps/web'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZUREAPPSERVICE_PASSWORD }}
