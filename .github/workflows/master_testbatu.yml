name: Deploy Node.js App to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Create missing workspace packages
        run: |
          echo "Creating missing workspace packages..."
          
          # Create eslint-config
          mkdir -p packages/eslint-config
          echo '{"name": "@repo/eslint-config", "version": "0.0.0", "private": true, "main": "index.js"}' > packages/eslint-config/package.json
          echo 'module.exports = {};' > packages/eslint-config/index.js
          
          # Create typescript-config
          mkdir -p packages/typescript-config  
          echo '{"name": "@repo/typescript-config", "version": "0.0.0", "private": true, "main": "base.json"}' > packages/typescript-config/package.json
          echo '{}' > packages/typescript-config/base.json
          
          # Create sanity (both sanity and fsanity in case it's a typo)
          mkdir -p packages/sanity
          echo '{"name": "@repo/sanity", "version": "0.0.0", "private": true, "main": "index.js"}' > packages/sanity/package.json
          echo 'module.exports = {};' > packages/sanity/index.js
          
          mkdir -p packages/fsanity
          echo '{"name": "@repo/fsanity", "version": "0.0.0", "private": true, "main": "index.js"}' > packages/fsanity/package.json
          echo 'module.exports = {};' > packages/fsanity/index.js
          
          echo "Packages directory after creation:"
          ls -la packages/
          
          echo "All package.json files:"
          find . -name "package.json" | xargs grep -l "repo" || true

      - name: Install dependencies
        run: npm install
          
      - name: Build web app
        run: npm run build:web

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testbatu'
          slot-name: 'production'
          package: './apps/web'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZUREAPPSERVICE_PASSWORD }}
