name: Deploy Node.js App to Azure App Service

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install production dependencies only
        run: |
          # Install only production dependencies
          npm install --omit=dev
          
      - name: Build web app
        run: npm run build:web

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'testbatu'
          slot-name: 'production'
          package: './apps/web'
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZUREAPPSERVICE_CLIENTID }}
          AZURE_TENANT_ID: ${{ secrets.AZUREAPPSERVICE_TENANTID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZUREAPPSERVICE_PASSWORD }}
